name: Build kernel / KernelSU

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Root: sukisu = SukiSU-Ultra, next = KernelSU-Next, none = stock"
        type: choice
        options: [sukisu, next, none]
        default: sukisu
      ksu_mode:
        description: "lkm = kernelsu.ko para parchear tu boot stock; builtin = KSU dentro del kernel"
        type: choice
        options: [lkm, builtin]
        default: lkm
      ksu_ref:
        description: "Tag o commit del repo de KSU (vacío = sukisu v3.0.0 / next v3.4.2)"
        default: ""
      localversion_suffix:
        description: "Sufijo opcional para uname -r (sólo builtin)"
        default: ""
      stock_boot_url:
        description: "Sólo builtin: URL directa a tu boot.img(.lz4) STOCK para generar boot.img/boot.tar"
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build-kernel.yml"

env:
  CLANG_VERSION: r510928
  CLANG_REF: android-15.0.0_r1
  MAGISK_VERSION: v31.1
  KSU: ${{ inputs.ksu || 'sukisu' }}
  KSU_MODE: ${{ inputs.ksu_mode || 'lkm' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev lz4 cpio dwarves \
            python3 git curl zip unzip kmod binutils-aarch64-linux-gnu

      - name: Caché de Clang AOSP
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-${{ env.CLANG_VERSION }}-${{ env.CLANG_REF }}

      - name: Descargar Clang AOSP ${{ env.CLANG_VERSION }}
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang
          curl -fL --retry 5 --retry-delay 10 -o clang.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${CLANG_REF}/clang-${CLANG_VERSION}.tar.gz"
          tar xzf clang.tgz -C ~/clang
          rm clang.tgz

      - name: Compilar
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
          LOCALVERSION_SUFFIX: ${{ inputs.localversion_suffix }}
        run: |
          [ -n "$KSU_REF" ] || unset KSU_REF
          [ "$KSU" = none ] && unset KSU_MODE
          export CLANG_DIR="$HOME/clang"
          ./scripts/build_ksu.sh
          echo "KREL=$(cat out/dist/kernel.release)" >> "$GITHUB_ENV"

      - name: Empaquetar AnyKernel3
        if: env.KSU_MODE != 'lkm'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/modules ak3/patch ak3/ramdisk ak3/README.md
          cp scripts/anykernel/anykernel.sh ak3/anykernel.sh
          cp out/dist/Image ak3/Image
          (cd ak3 && zip -r9 "../out/dist/AK3-a14xm-${KREL}.zip" . -x '*.placeholder')

      - name: boot.img + boot.tar (Odin) desde tu boot stock
        if: ${{ inputs.stock_boot_url && env.KSU_MODE != 'lkm' }}
        env:
          STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
        run: |
          curl -fL --retry 3 -o magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"
          mkdir -p ~/bin
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > ~/bin/magiskboot
          chmod +x ~/bin/magiskboot
          export PATH="$HOME/bin:$PATH"
          case "$STOCK_BOOT_URL" in *.lz4) f=stock_boot.img.lz4 ;; *) f=stock_boot.img ;; esac
          curl -fL --retry 3 -o "$f" "$STOCK_BOOT_URL"
          ./scripts/repack_boot.sh "$f" out/dist/Image out/dist

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: a14xm-${{ env.KSU }}-${{ env.KSU_MODE }}-${{ env.KREL }}
          path: |
            out/dist/android15-6.6_kernelsu.ko
            out/dist/Image
            out/dist/Image.gz
            out/dist/Image.lz4
            out/dist/AK3-*.zip
            out/dist/boot.img
            out/dist/boot.tar
            out/dist/kernel.config
            out/dist/kernel.release
          if-no-files-found: warn
